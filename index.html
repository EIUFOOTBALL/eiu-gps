<title>EIU GPS Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky navy scoreboard bar with tabs; one column of report cards below; wide tables scroll inside their card. */
:root {
  --bg: #f3f5f9; --surface: #ffffff; --surface-2: #eef1f7; --line: #dde2ec;
  --fg: #141a2b; --muted: #5b6478; --accent: #1f3a8a; --accent-fg: #ffffff; --bar: #15255e; --bar-fg: #ffffff;
  --game: #1f3a8a; --prac: #9fb0d8; --avg: #d97706;
  --f-green-bg: #d4edda; --f-green-fg: #14532d;
  --f-yel-bg: #fff3cd; --f-yel-fg: #5c4708;
  --f-yel2-bg: #ffd966; --f-yel2-fg: #4a3700;
  --f-red-bg: #f8d7da; --f-red-fg: #7f1d1d;
  --f-red2-bg: #e06666; --f-red2-fg: #ffffff;
  --f-blue-bg: #d6e4f5; --f-blue-fg: #1e3a6b;
  --f-gray-bg: #eeeeee; --f-gray-fg: #555b66;
  --f-lav-bg: #c9d2f0; --f-lav-fg: #1f2a5c;
  --z-green: #4caf72; --z-yel: #f2d675; --z-yel2: #e0a82e; --z-red: #e06666; --z-red2: #b42318;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1220; --surface: #161b2c; --surface-2: #1d2337; --line: #2a3150;
  --fg: #e7eaf3; --muted: #9aa3ba; --accent: #8ea8ff; --accent-fg: #0e1220; --bar: #0a0f22; --bar-fg: #e7eaf3;
  --game: #8ea8ff; --prac: #3d4a78; --avg: #f59e0b;
  --f-green-bg: #1c3a27; --f-green-fg: #b7e4c4; --f-yel-bg: #3a3218; --f-yel-fg: #f3e0a0;
  --f-yel2-bg: #6b5414; --f-yel2-fg: #ffeaa8; --f-red-bg: #4a2226; --f-red-fg: #f6c4c9;
  --f-red2-bg: #a83a3a; --f-red2-fg: #ffffff; --f-blue-bg: #1e3150; --f-blue-fg: #c5d8f3;
  --f-gray-bg: #262b38; --f-gray-fg: #9aa3ba; --f-lav-bg: #2a3358; --f-lav-fg: #d3dbfa;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1220; --surface: #161b2c; --surface-2: #1d2337; --line: #2a3150;
  --fg: #e7eaf3; --muted: #9aa3ba; --accent: #8ea8ff; --accent-fg: #0e1220; --bar: #0a0f22; --bar-fg: #e7eaf3;
  --game: #8ea8ff; --prac: #3d4a78; --avg: #f59e0b;
  --f-green-bg: #1c3a27; --f-green-fg: #b7e4c4; --f-yel-bg: #3a3218; --f-yel-fg: #f3e0a0;
  --f-yel2-bg: #6b5414; --f-yel2-fg: #ffeaa8; --f-red-bg: #4a2226; --f-red-fg: #f6c4c9;
  --f-red2-bg: #a83a3a; --f-red2-fg: #ffffff; --f-blue-bg: #1e3150; --f-blue-fg: #c5d8f3;
  --f-gray-bg: #262b38; --f-gray-fg: #9aa3ba; --f-lav-bg: #2a3358; --f-lav-fg: #d3dbfa;
  color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1180px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: .01em; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* lock screen */
#lock { min-height: 100vh; display: grid; place-items: center; padding-block: 48px; }
.lockcard { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 28px 24px; display: grid; gap: 14px; }
.mark { display: flex; align-items: baseline; gap: 10px; }
.mark b { font-family: var(--display); font-size: 34px; font-weight: 700; color: var(--accent); letter-spacing: .02em; }
.mark span { font-family: var(--display); font-size: 20px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.lockcard p { margin: 0; color: var(--muted); }
.lockcard input[type=password] { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.check { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.btn { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 6px; padding: 10px 14px; font-weight: 600; cursor: pointer; }
.btn:disabled { opacity: .6; cursor: progress; }
.err { color: var(--f-red-fg); background: var(--f-red-bg); padding: 8px 10px; border-radius: 6px; font-size: 13px; }

/* top bar */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); color: var(--bar-fg); }
.topin { display: flex; align-items: center; gap: 16px; padding-block: 10px 0; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: 24px; font-weight: 700; letter-spacing: .03em; }
.brand small { font-size: 14px; font-weight: 500; opacity: .7; margin-left: 8px; letter-spacing: .06em; text-transform: uppercase; }
.topin .sp { flex: 1; }
.lockbtn { background: transparent; border: 1px solid rgba(255,255,255,.3); color: var(--bar-fg); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }

<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
             set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
             del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
let D = null;          // decrypted data
let DAY = null;        // selected day key 'MM/DD'
let PLAYER = null, METRIC = 'Distance', ACWRMODE = 'day', LSGROUP = 'All';

/* ---------- unlock ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function gunzip(buf) {
  if ('DecompressionStream' in window) {
    const st = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(st).text();
  }
  await new Promise((ok, no) => { const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  return window.pako.ungzip(new Uint8Array(buf), { to: 'string' });
}
let BLOB = null;
async function unlock(pw) {
  if (!BLOB && window.EIU_EMBED) BLOB = window.EIU_EMBED;  // standalone file: encrypted data is inside the page
  if (!BLOB) { const r = await fetch('data.json', { cache: 'no-store' }); if (!r.ok) throw new Error('load'); BLOB = await r.json(); }
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(BLOB.salt), iterations: BLOB.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  let plain;
  try { plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(BLOB.iv) }, key, b64(BLOB.ct)); }
  catch (e) { throw new Error('pw'); }
  return JSON.parse(await gunzip(plain));
}
async function tryUnlock(pw, remember) {
  const btn = $('#unlock'), err = $('#lockerr');
  btn.disabled = true; btn.textContent = 'Opening…'; err.hidden = true;
  try {
    D = await unlock(pw);
    if (remember) LS.set('eiugps-pw', pw);
    start();
  } catch (e) {
    err.textContent = e.message === 'pw' ? "That password didn't work. Check it and try again." : "The report data didn't load. Refresh the page and try again.";
    err.hidden = false; LS.del('eiugps-pw');

}
$('#lockform').addEventListener('submit', e => { e.preventDefault(); const pw = $('#pw').value; if (pw) tryUnlock(pw, $('#remember').checked); });
$('#relock').addEventListener('click', () => { LS.del('eiugps-pw'); D = null; $('#app').hidden = true; $('#lock').hidden = false; $('#pw').value = ''; });
const saved = LS.get('eiugps-pw');
if (saved) { $('#remember').checked = true; tryUnlock(saved, true); }

/* ---------- helpers ---------- */
const C = {}; // log column index
const games = new Set();
let LOG = [], DATES = [];
function prep() {
  D.log.cols.forEach((c, i) => C[c] = i);
  LOG = D.log.rows;
  const ds = new Set();
  LOG.forEach(r => { ds.add(r[C.Date]); if (String(r[C.Session]).startsWith('GAME')) games.add(r[C.Date]); });
  DATES = [...ds].sort((a, b) => new Date(b) - new Date(a));
  DAY = D.coach[0].key;
}
const dkey = d => d.slice(0, 5);
const isOff = n => D.players[n] && D.players[n].off;
const num = v => (v === null || v === undefined || v === '') ? null : +v;
const fmt0 = v => v == null ? '–' : Math.round(v).toLocaleString('en-US');
const fmt1 = v => v == null ? '–' : (+v).toFixed(1);
function pct(a, b) { if (a == null || !b) return ''; const p = (a / b - 1) * 100; return `<span class="${p >= 0 ? 'up' : 'down'}">${p >= 0 ? '+' : ''}${p.toFixed(0)}%</span>`; }

function cellHTML(c, isName) {
  let t, f, b;
  if (Array.isArray(c)) [t, f, b] = c; else t = c;
  let inner = esc(t);
  if (isName && t && D.players[t]) inner = `<a class="pl" href="#players" data-player="${esc(t)}">${esc(t)}</a>`;
  else if (b) inner = `<strong>${inner}</strong>`;
  return { inner, cls: f ? `f-${f}` : '' };
}
function tableHTML(tb, opts = {}) {
  if (tb.head && !tb.rows.length) return '<div class="empty">No players in this group here.</div>';
  const head = tb.head || [];
  const nameCol = head.findIndex(h => /^(Athlete|Player)$/.test(h));
  const grpCol = head.findIndex(h => h === 'Group');
  const left = i => i === nameCol || i === grpCol || (nameCol === -1 && i === 0);
  let h = '<table>';
  if (tb.gh) {
    const lo = tb.cols[0], w = tb.cols[1] - lo + 1; let cur = 0; h += '<thead><tr>';
    for (const [col, span, text] of tb.gh) { const at = col - lo; if (at > cur) h += `<th colspan="${at - cur}"></th>`; h += `<th class="gh" colspan="${span}">${esc(text)}</th>`; cur = at + span; }
    if (cur < w) h += `<th colspan="${w - cur}"></th>`;
    h += '</tr>';
  } else h += '<thead>';
  if (head.length) h += '<tr>' + head.map((x, i) => `<th class="${left(i) ? 'l' : ''}${i === nameCol ? ' stick' : ''}">${esc(x)}</th>`).join('') + '</tr>';
  h += '</thead><tbody>';
  const rows = tb.rows, lim = opts.limit && rows.length > opts.limit + 3 ? opts.limit : rows.length;
  rows.forEach((r, ri) => {
    h += `<tr${ri >= lim ? ' hidden data-more' : ''}>` + r.map((c, i) => {
      const { inner, cls } = cellHTML(c, i === nameCol || (nameCol === -1 && i === 0));
      return `<td class="${[cls, left(i) ? 'l' : '', i === nameCol ? 'stick' : '', i === grpCol ? 'grp' : ''].join(' ').trim()}">${inner}</td>`;
    }).join('') + '</tr>';
  });
  h += '</tbody></table>';
  const more = lim < rows.length ? `<button class="more" type="button" data-showmore>Show all ${rows.length} players</button>` : '';
  return `<div class="tw">${h}</div>${more}`;
}
// blocks -> cards: heading starts a card; notes go under it; tables inside
function blocksHTML(blocks, opts = {}) {
  let out = '', card = null;
  const close = () => { if (card) { out += card.h + '</section>'; card = null; } };
  const open = (title, sub) => { close(); card = { h: `<section class="card"><div class="ch">${title ? `<h2>${title}</h2>` : ''}${sub || ''}</div>` }; };
  for (const b of blocks) {
    if (b.t === 'title') continue;
    if (b.t === 'h') { const m = b.x.match(/^(.*?)\s{2,}\((.*)\)\s*$/); open(m ? `${esc(m[1])}<span class="count">${esc(m[2])}</span>` : esc(b.x)); continue; }
    if (b.t === 'n') {
      if (b.b && !card) { open(esc(b.x)); continue; }
      if (b.b && card && card.h.includes('<table')) { open(esc(b.x)); continue; }
      if (!card) open('');
      card.h = card.h.replace(/<\/div>$/, '') ; // keep notes inside the header block
      card.h += `<div class="sub">${esc(b.x)}</div></div>`; continue;
    }
    if (b.t === 'table') { if (!card) open(''); card.h += tableHTML(b, { limit: opts.limit && opts.limit(card.h) }); }

}
function legend() {
  return `<div class="legend"><span><i class="f-D4EDDA"></i>Green: OK / up 10–30%</span><span><i class="f-FFF3CD"></i>Yellow: watch</span><span><i class="f-F8D7DA"></i>Red: flag</span><span><i class="f-E06666"></i>Dark red: high load score (8–10)</span></div>`;
}

    <button class="step" type="button" data-step="-1" ${i <= 0 ? 'disabled' : ''} aria-label="Later day">Later ›</button></div>`;

/* ---------- views ---------- */
function teamKPIs(key, G = 'All', noPL = false) {
  const di = DATES.findIndex(d => dkey(d) === key);
  if (di < 0) return '';
  const day = DATES[di], prev = DATES[di + 1];
  const stat = (d, g) => {
    const rs = LOG.filter(r => r[C.Date] === d && !isOff(r[C.Athlete]) && ['Skill', 'Mid', 'Big'].includes(r[C.Group]) && (!g || r[C.Group] === g));
    const avg = col => { const v = rs.map(r => num(r[col])).filter(v => v != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
    return { n: rs.length, ts: avg(C['Top Speed']), dist: avg(C.Distance), pl: avg(C['Player Load']), hsy: avg(C['High-Speed Yards']) };
  };
  const gg = G === 'All' ? null : G, gl = gg ? gg + 's' : 'Team';

function flagStrip(blocks) {

    const m = b.x.match(/^(\d)\.\s*(.*?)\s{2,}\((.*)\)/);

    const f = m[3].match(/(\d+) flagged/); const pl = m[3].match(/^(\d+) players/);
    const n = f ? +f[1] : pl ? +pl[1] : null;
    if (n == null) return;
    const T = m[2].toUpperCase(), wkly = /THIS WEEK/.test(T);
    const short = /^DISTANCE|^TOTAL YARDS/.test(T) ? `Distance flags (${wkly ? 'week' : 'day'})` : /^HIGH-SPEED/.test(T) ? `HSY flags (${wkly ? 'week' : 'day'})` : /90% OF MAX/.test(T) ? 'Still need 90% speed' : m[2];
    const warm = /90% OF MAX/.test(T);
    items.push(`<a href="#sec-${m[1]}" class="${n === 0 ? '' : (warm ? 'warm' : 'hot')}" data-jump="sec-${m[1]}"><b>${n}</b>${esc(short)}</a>`);
  });
  const sec = blocks.find(b => b.t === 'h' && /^1\./.test(b.x));
  if (sec) {
    const tb = blocks[blocks.indexOf(sec) + 2];
    if (tb && tb.t === 'table') {

      items.unshift(`<a href="#sec-1" class="${hi ? 'hot' : ''}" data-jump="sec-1"><b>${hi}</b>Load score 7+</a>`);
    }

  return items.length ? `<div class="flagstrip">${items.join('')}</div>` : '';
}
// keep only one position group in every table that has a Group column; recount the heading numbers
function filterGroup(blocks, G) {

  const out = blocks.map(b => {
    if (b.t !== 'table') return b;
    const gi = (b.head || []).indexOf('Group');
    return gi < 0 ? b : Object.assign({}, b, { rows: b.rows.filter(r => val(r[gi]) === G) });
  });
  return out.map((b, i) => {
    if (b.t !== 'h') return b;
    const m = b.x.match(/^(.*?)\s{2,}\((.*)\)\s*$/); if (!m) return b;
    const tb = out.slice(i + 1).find(x => x.t === 'table' || x.t === 'h'); if (!tb || tb.t !== 'table') return b;
    const n = tb.rows.length;
    const f = tb.rows.filter(r => r.some(c => Array.isArray(c) && ['FFF3CD', 'F8D7DA', 'E06666'].includes(c[1]))).length;
    let c = m[2];
    if (/players\)?$/.test(c) || /^\d+ players/.test(c)) c = `${n} players`;
    else if (/up 10%\+/.test(c)) c = `${n} up 10%+, ${f} flagged over 30%`;
    else if (/flagged/.test(c)) c = `${n} flagged, 1 SD+ above`;

}

function footballTrim(blocks) {
  const out = []; let skip = false, k = 0;
  for (const b of blocks) {
    if (b.t === 'h') { skip = /^\d\.\s*(PLAYER LOAD|NEEDS 90% OF MAX SPEED)/i.test(b.x); if (skip) continue;
      if (/^\d\./.test(b.x)) { out.push({ t: 'h', x: b.x.replace(/^\d/, ++k) }); continue; } }
    if (skip) continue;
    if (b.t === 'n') { out.push(Object.assign({}, b, { x: b.x.replace(/,? ?Player Load,?/g, m => m.startsWith(',') && m.endsWith(',') ? ',' : '').replace(/\(yards, HSY accels\/decels\)/, '(yards, HSY, accels/decels)') })); continue; }
    if (b.t === 'table' && b.head) {
      const keep = b.head.map((h, i) => /player load/i.test(h) ? -1 : i).filter(i => i >= 0);
      if (keep.length === b.head.length) { out.push(b); continue; }
      out.push(Object.assign({}, b, { gh: null, cols: [b.cols[0], b.cols[0] + keep.length - 1], head: keep.map(i => b.head[i]), rows: b.rows.map(r => keep.map(i => r[i])) }));
      continue;
    }
    out.push(b);
  }
  return out;
}

  ${info.status ? `<div class="status">${esc(info.status)}. His data is kept here, but he is left off the report tabs.</div>` : ''}
  <div class="pgrid">${tiles.map(t => `<div class="kpi"><div class="eyebrow">${t[0]}</div><div class="v">${t[1]}</div><div class="d">${t[2]}</div></div>`).join('')}</div>
  <section class="card"><div class="ch"><h2>${esc(mdef[1])} by session</h2><div class="sub">${window.innerWidth < 640 ? 'His last 24 sessions' : 'Every GPS session this season'}, oldest to newest. Tap a metric to switch.</div></div>
    <div class="toolbar" style="padding:4px 14px 8px"><div class="seg" role="group" aria-label="Metric">${METRICS.map(m => `<button type="button" data-metric="${esc(m[0])}" aria-pressed="${m[0] === METRIC}">${esc(m[1])}</button>`).join('')}</div></div>
    <div class="chartleg"><span><i style="background:var(--prac)"></i>Practice</span><span><i style="background:var(--game)"></i>Game</span><span><i style="background:var(--avg)"></i>Average of his last 6 sessions</span></div>
    <div class="chartbox">${rows.length ? barChart(rows, C[mdef[0]], mdef[2]) : '<div class="empty">No sessions.</div>'}</div></section>
  <section class="card"><div class="ch"><h2>By week</h2><div class="sub">Newest first. ${hsyNeed ? 'HSY is green at 30+ and red under 30 for completed weeks.' : ''}</div></div>
    <div class="tw"><table><thead><tr><th class="l stick">Week</th><th>Sessions</th><th>Practice yds</th><th>Game yds</th><th>Total yds</th><th>HSY</th><th>Player Load</th><th>Top speed</th><th>Accels + decels</th><th>High accels</th><th>High decels</th></tr></thead><tbody>${weekRows}</tbody></table></div></section>
  <section class="card"><div class="ch"><h2>Every session</h2><div class="sub">Load score: under 5 green, 5s light yellow, 6s dark yellow, 7s red, 8–10 dark red. Accels + decels over 200 in red.</div></div>
    <div class="tw"><table><thead><tr><th class="l stick">Date</th><th class="l">Session</th><th>Yards</th><th>HSY</th><th>Player Load</th><th>Top speed</th><th>Load score</th><th>Accels + decels</th><th>High accels</th><th>High decels</th></tr></thead><tbody>${sessRows}</tbody></table></div>${rows.length > 12 ? `<button class="more" type="button" data-showmore>Show all ${rows.length} sessions</button>` : ''}</section>`;
}

/* ---------- routing ---------- */
const VIEWS = { coach: viewCoach, football: viewFootball, players: viewPlayers, graphs: viewGraphs, speed90: viewSpeed90, acwr: viewACWR, speed: viewSpeed, accels: viewAccels };
function route() {
  if (!D) return;
  let v = location.hash.replace('#', '');
  if (!VIEWS[v]) v = 'football';
  document.querySelectorAll('#tabs a').forEach(a => a.setAttribute('aria-current', a.getAttribute('href') === '#' + v ? 'page' : 'false'));
  $('#main').innerHTML = `<div class="view">${VIEWS[v]()}</div>`;
  LS.set('eiugps-view', v);
}
function start() {
  prep();
  $('#lock').hidden = true; $('#app').hidden = false;
  $('#through').textContent = 'Through ' + DATES[0];
  $('#foot').textContent = `Data through ${DATES[0]} · updated ${D.built}. Built from the load-monitoring workbook. Player data is locked with the team password; please don't share it outside the staff.`;
  if (!location.hash) { const v = LS.get('eiugps-view'); if (v && VIEWS[v]) { history.replaceState(null, '', '#' + v); } }
  route();
}
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
document.addEventListener('change', e => {
  if (e.target.id === 'swk') { SWEEK = e.target.value; route(); return; }
  if (e.target.id === 'gpadd' && e.target.value) { GPLAYERS.push(e.target.value); if (GPLAYERS.length === 1 && GLINES === 'all') GLINES = 'all'; const y = window.scrollY; route(); window.scrollTo(0, y); return; }
  if (e.target.matches('[data-day]')) { DAY = e.target.value; route(); }
  if (e.target.id === 'psel') { PLAYER = e.target.value; route(); }
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-sgroup],[data-gprem],[data-glines],[data-grange],[data-gsess],[data-ggroup],[data-lsgroup],[data-step],[data-player],[data-metric],[data-acwr],[data-showmore],[data-jump]');
  if (!t) return;
  if (t.dataset.sgroup) { SGROUP = t.dataset.sgroup; const y = window.scrollY; route(); window.scrollTo(0, y); }
  else if (t.dataset.gprem) { GPLAYERS = GPLAYERS.filter(n => n !== t.dataset.gprem); if (!GPLAYERS.length && GLINES === 'none') GLINES = 'all'; const y = window.scrollY; route(); window.scrollTo(0, y); }
  else if (t.dataset.glines || t.dataset.grange || t.dataset.gsess || t.dataset.ggroup) { if (t.dataset.glines) GLINES = t.dataset.glines; if (t.dataset.grange) GRANGE = t.dataset.grange; if (t.dataset.gsess) GSESS = t.dataset.gsess; if (t.dataset.ggroup) GGROUP = t.dataset.ggroup; const y = window.scrollY; route(); window.scrollTo(0, y); }
  else if (t.dataset.lsgroup) { LSGROUP = t.dataset.lsgroup; const y = window.scrollY; route(); window.scrollTo(0, y); }
  else if (t.dataset.step) { const sel = $('[data-day]'); const i = sel.selectedIndex + (+t.dataset.step); if (i >= 0 && i < sel.options.length) { DAY = sel.options[i].value; route(); } }
  else if (t.dataset.player) { e.preventDefault(); PLAYER = t.dataset.player; if (location.hash === '#players') route(); else location.hash = 'players'; }
  else if (t.dataset.metric) { METRIC = t.dataset.metric; const y = window.scrollY; route(); window.scrollTo(0, y); }
  else if (t.dataset.acwr) { ACWRMODE = t.dataset.acwr; route(); }
  else if (t.dataset.showmore !== undefined) { const card = t.parentElement; card.querySelectorAll('tr[data-more]').forEach(r => r.hidden = false); t.remove(); }
  else if (t.dataset.jump) { e.preventDefault(); const el = document.getElementById(t.dataset.jump); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
});
})();
</script>
</body></html>
